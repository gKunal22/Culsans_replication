# name      | Splash-3 directory (codes/...)      | arguments (@P@ = number of harts) | stdin file | other input files
# Inputs are reduced from the Splash-3 defaults to keep simulation time practical (ASSUMPTIONS A11).
fft         | kernels/fft                         | -p@P@ -m12                       |            |
radix       | kernels/radix                       | -p@P@ -n16384 -r256              |            |
lu_cont     | kernels/lu/contiguous_blocks        | -p@P@ -n64 -b8                   |            |
lu_nc       | kernels/lu/non_contiguous_blocks    | -p@P@ -n64 -b8                   |            |
ocean       | apps/ocean/contiguous_partitions    | -p@P@ -n66                       |            |
cholesky    | kernels/cholesky                    | -p@P@                            | splash:kernels/cholesky/inputs/lshp.O |
barnes      | apps/barnes                         |                                  | barnes.in  |
fmm         | apps/fmm                            |                                  | fmm.in     |
water_nsq   | apps/water-nsquared                 |                                  | water.in   | splash:apps/water-nsquared/random.in
water_sp    | apps/water-spatial                  |                                  | water.in   | splash:apps/water-spatial/random.in
radiosity   | apps/radiosity                      | -p @P@ -batch -room -ae 50000 -bf 0.5 -en 0.5 |  |  | glibdumb glibps
